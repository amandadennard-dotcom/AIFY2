<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hear the Frequency Picture</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Geist', system-ui, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.5; background: #FFFFFF; color: #222222; padding: 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .instructions { color: #1F1976; background: #F7F7FB; border-left: 4px solid #4C42CF; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
  .cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .card { flex: 1 1 300px; max-width: 360px; background: #F7F7FB; border-radius: 10px; padding: 16px; }
  h2 { font-size: 24px; font-weight: 700; color: #1F1976; text-align: center; margin: 0 0 12px 0; }
  .plot { display: flex; gap: 8px; align-items: stretch; }
  .axis { display: flex; flex-direction: row; align-items: stretch; gap: 4px; }
  .axis svg { width: 24px; height: auto; }
  .axis span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 16px; color: #222222; align-self: center; }
  .imgbox { position: relative; flex: 1; }
  .imgbox img { display: block; width: 100%; height: auto; border-radius: 4px; border: 1px solid #E4E2F8; }
  .speaker {
    position: absolute; right: 10px; bottom: 10px; width: 52px; height: 52px; border-radius: 50%;
    border: 3px solid #FFFFFF; background: #4C42CF; color: #FFFFFF; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .speaker:hover { background: #1F1976; }
  .speaker:focus-visible { outline: 3px solid #1F1976; outline-offset: 3px; }
  .speaker[aria-pressed="true"] { background: #1F1976; }
  .speaker svg { width: 28px; height: 28px; }
  .speaker .waves { display: none; }
  .speaker[aria-pressed="true"] .waves { display: inline; }
  .status { text-align: center; margin-top: 10px; min-height: 24px; font-size: 16px; color: #1F1976; font-weight: 600; }
  .reflect { margin-top: 16px; background: #E4E2F8; border-radius: 8px; padding: 12px 16px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
</style>
</head>
<body>
<div class="wrap">
  <div class="instructions">Select the speaker on each picture to hear the sound it shows. Listen to both, then compare what you hear with what you see.</div>
  <div class="cards">
    <div class="card">
      <h2>Cello</h2>
      <div class="plot">
        <div class="axis" aria-hidden="true">
          <span>Frequency</span>
          <svg viewBox="0 0 24 200" preserveAspectRatio="none" width="24"><polygon points="12,0 5,14 19,14" fill="#222222"/><line x1="12" y1="12" x2="12" y2="186" stroke="#222222" stroke-width="2"/><rect x="7" y="186" width="10" height="10" fill="#222222"/></svg>
        </div>
        <div class="imgbox">
          <img src="cello-spectrogram.png" alt="Frequency picture of a cello note. Frequency runs from low at the bottom to high at the top. The darkest, strongest band is a thick line at the very bottom. Above it the picture fades to light gray with fine vertical streaks, so most of the sound is low frequency.">
          <button type="button" class="speaker" data-audio="cello" aria-pressed="false" aria-label="Play cello sound">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"/><g class="waves"><path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g></svg>
          </button>
        </div>
      </div>
      <audio id="cello" src="cello-c2.mp3" preload="auto"></audio>
    </div>
    <div class="card">
      <h2>Violin</h2>
      <div class="plot">
        <div class="axis" aria-hidden="true">
          <span>Frequency</span>
          <svg viewBox="0 0 24 200" preserveAspectRatio="none" width="24"><polygon points="12,0 5,14 19,14" fill="#222222"/><line x1="12" y1="12" x2="12" y2="186" stroke="#222222" stroke-width="2"/><rect x="7" y="186" width="10" height="10" fill="#222222"/></svg>
        </div>
        <div class="imgbox">
          <img src="violin-spectrogram.png" alt="Frequency picture of a violin note played by plucking the string. Frequency runs from low at the bottom to high at the top. Several dark horizontal bands are stacked from the bottom to the middle, with a repeating pattern of dark spots across each band, so the sound is spread across many frequencies.">
          <button type="button" class="speaker" data-audio="violin" aria-pressed="false" aria-label="Play violin sound">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"/><g class="waves"><path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g></svg>
          </button>
        </div>
      </div>
      <audio id="violin" src="violin-a4.mp3" preload="auto"></audio>
    </div>
  </div>
  <div class="status" id="status"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
</div>
<script>
(function(){
  var buttons = document.querySelectorAll('.speaker');
  var statusEl = document.getElementById('status'), live = document.getElementById('live');
  var names = { cello: 'Cello', violin: 'Violin' };
  function say(t){ statusEl.textContent = t; live.textContent = t; }
  function reset(btn){
    var a = document.getElementById(btn.dataset.audio);
    a.pause(); a.currentTime = 0;
    btn.setAttribute('aria-pressed','false');
    btn.setAttribute('aria-label','Play ' + btn.dataset.audio + ' sound');
  }
  buttons.forEach(function(btn){
    var a = document.getElementById(btn.dataset.audio);
    a.addEventListener('ended', function(){ reset(btn); say(''); });
    btn.addEventListener('click', function(){
      if (btn.getAttribute('aria-pressed') === 'true') { reset(btn); say('Stopped.'); return; }
      buttons.forEach(reset);
      var p = a.play();
      btn.setAttribute('aria-pressed','true');
      btn.setAttribute('aria-label','Stop ' + btn.dataset.audio + ' sound');
      say('Playing ' + names[btn.dataset.audio] + '.');
      if (p && p.catch) p.catch(function(){ reset(btn); say('The sound could not play. Try again.'); });
    });
  });
})();
</script>
</body>
</html>
