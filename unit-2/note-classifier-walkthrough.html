<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From a Note to a Prediction</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Geist', system-ui, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.5; background: #FFFFFF; color: #222222; padding: 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .instructions { color: #1F1976; background: #F7F7FB; border-left: 4px solid #4C42CF; border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
  h2 { font-size: 18px; font-weight: 700; color: #1F1976; margin: 0 0 8px 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .pick, .tab, .key { font-family: inherit; font-size: 16px; font-weight: 600; border-radius: 8px; border: 2px solid #ACA8EA; background: #FFFFFF; color: #1F1976; padding: 8px 14px; cursor: pointer; }
  .pick { flex: 1 1 120px; font-weight: 700; }
  .pick[aria-pressed="true"], .tab[aria-selected="true"] { background: #4C42CF; border-color: #4C42CF; color: #FFFFFF; }
  .tab { flex: 1 1 150px; }
  .key { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .key[aria-pressed="true"] { background: #E4E2F8; border-color: #4C42CF; }
  .pick:focus-visible, .tab:focus-visible, .key:focus-visible, input:focus-visible { outline: 3px solid #1F1976; outline-offset: 2px; }
  .code { background: #1F1976; border-radius: 10px; padding: 12px 8px; margin-bottom: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; line-height: 1.6; color: #E4E2F8; overflow-x: auto; }
  .line { display: block; white-space: pre; padding: 1px 12px; border-left: 4px solid transparent; }
  .line.on { background: rgba(172,168,234,0.35); border-left-color: #FFFFFF; color: #FFFFFF; }
  .panel { background: #F7F7FB; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .panel p { margin: 0 0 8px 0; }
  .slider { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .slider label { font-weight: 600; min-width: 190px; }
  .slider input[type=range] { flex: 1 1 200px; accent-color: #4C42CF; height: 28px; }
  .slider .val { font-weight: 700; color: #1F1976; min-width: 40px; }
  .out { background: #FFFFFF; border: 2px solid #4C42CF; border-radius: 8px; padding: 8px 14px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; color: #1F1976; display: inline-block; }
  .explain { background: #E4E2F8; border-radius: 8px; padding: 10px 14px; }
  .hidden { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
</style>
</head>
<body>
<div class="wrap">
  <div class="instructions" id="instr"></div>

  <h2 id="pickLabel">Pick a note</h2>
  <div class="row" role="group" aria-labelledby="pickLabel">
    <button type="button" class="pick" data-note="cello" aria-pressed="true">Cello</button>
    <button type="button" class="pick" data-note="violin" aria-pressed="false">Violin</button>
  </div>

  <div class="row" role="tablist" aria-label="Steps">
    <button type="button" class="tab" role="tab" data-step="1" aria-selected="true">1. The dictionary</button>
    <button type="button" class="tab" role="tab" data-step="2" aria-selected="false">2. One conditional</button>
    <button type="button" class="tab" role="tab" data-step="3" aria-selected="false">3. Nested conditional</button>
  </div>

  <div class="code" id="code" role="group" aria-label="Python code"></div>

  <div id="step1" class="panel">
    <p>Select a key to read its value back out of the dictionary.</p>
    <div class="row" id="keys">
      <button type="button" class="key" data-key="frequency" aria-pressed="false">note["frequency"]</button>
      <button type="button" class="key" data-key="volume" aria-pressed="false">note["volume"]</button>
      <button type="button" class="key" data-key="brightness" aria-pressed="false">note["brightness"]</button>
    </div>
    <div class="out" id="keyOut">Python gives back: ?</div>
  </div>

  <div id="step2" class="panel hidden">
    <div class="slider">
      <label for="fcut">Frequency cutoff</label>
      <input type="range" id="fcut" min="100" max="500" step="10" value="400">
      <span class="val" id="fcutVal">400</span>
    </div>
    <div class="out" id="out2"></div>
  </div>

  <div id="step3" class="panel hidden">
    <div class="slider">
      <label for="fcut3">Frequency cutoff</label>
      <input type="range" id="fcut3" min="100" max="500" step="10" value="400">
      <span class="val" id="fcut3Val">400</span>
    </div>
    <div class="slider">
      <label for="bcut">Brightness cutoff</label>
      <input type="range" id="bcut" min="0" max="60" step="5" value="30">
      <span class="val" id="bcutVal">30</span>
    </div>
    <div class="out" id="out3"></div>
  </div>

  <div class="explain" id="explain" style="margin-top:12px;"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
</div>
<script>
(function(){
  var NOTES = { cello: {frequency:300, volume:60, brightness:20}, violin: {frequency:300, volume:60, brightness:35} };
  var state = { note:'cello', step:1, key:null, fcut:400, bcut:30 };
  var code = document.getElementById('code'), explain = document.getElementById('explain'), live = document.getElementById('live');
  var INSTR = {
    1: 'Pick a note, then read its features back out of the dictionary.',
    2: 'Move the cutoff and watch which line of the conditional runs.',
    3: 'Nest a second conditional inside the first, then move both cutoffs.'
  };
  function say(t){ explain.textContent = t; live.textContent = t; }
  function lines(arr){
    code.innerHTML = '';
    arr.forEach(function(l){
      var s = document.createElement('span'); s.className = 'line' + (l.on ? ' on' : ''); s.textContent = l.t; code.appendChild(s);
    });
  }
  function render(){
    var n = NOTES[state.note], s = state.step;
    document.getElementById('instr').textContent = INSTR[s];
    ['1','2','3'].forEach(function(k){ document.getElementById('step'+k).classList.toggle('hidden', k != s); });
    document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.step == s ? 'true':'false'); });
    document.querySelectorAll('.pick').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.note === state.note ? 'true':'false'); });
    if (s === 1){
      var keys = ['frequency','volume','brightness'];
      var arr = [{t:'note = {'}];
      keys.forEach(function(k,i){ arr.push({t:'    "'+k+'": '+n[k]+(i<2?',':''), on: state.key===k}); });
      arr.push({t:'}'});
      lines(arr);
      document.querySelectorAll('.key').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.key===state.key?'true':'false'); });
      document.getElementById('keyOut').textContent = 'Python gives back: ' + (state.key ? n[state.key] : '?');
      say(state.key ? 'The key "'+state.key+'" holds the value '+n[state.key]+' for this '+state.note+' note.' : 'A dictionary bundles a note\'s features under one name. Each key names a feature, and each value is its number.');
    } else if (s === 2){
      var f = n.frequency, c = state.fcut, big = f > c;
      lines([
        {t:'if note["frequency"] > '+c+':', on:true},
        {t:'    print("violin")', on:big},
        {t:'else:', on:!big},
        {t:'    print("cello")', on:!big}
      ]);
      document.getElementById('fcutVal').textContent = c;
      document.getElementById('out2').textContent = 'Prints: ' + (big ? 'violin' : 'cello');
      say('This '+state.note+' has a frequency of '+f+'. Is '+f+' greater than '+c+'? '+(big?'Yes, so Python prints violin.':'No, so Python runs the else and prints cello.')+' Both notes have a frequency of 300, so they always get the same prediction here.');
    } else {
      var f3 = n.frequency, c3 = state.fcut, b = n.brightness, bc = state.bcut;
      var top = f3 > c3, bright = b > bc;
      lines([
        {t:'if note["frequency"] > '+c3+':', on:true},
        {t:'    print("violin")', on:top},
        {t:'else:', on:!top},
        {t:'    if note["brightness"] > '+bc+':', on:!top},
        {t:'        print("violin")', on:!top && bright},
        {t:'    else:', on:!top && !bright},
        {t:'        print("cello")', on:!top && !bright}
      ]);
      document.getElementById('fcut3Val').textContent = c3;
      document.getElementById('bcutVal').textContent = bc;
      var pred = top ? 'violin' : (bright ? 'violin' : 'cello');
      document.getElementById('out3').textContent = 'Prints: ' + pred;
      var msg = 'Frequency '+f3+(top?' is greater than ':' is not greater than ')+c3+'. ';
      if (top) msg += 'Python prints violin without checking brightness.';
      else msg += 'Python moves to the inner conditional. Brightness '+b+(bright?' is greater than ':' is not greater than ')+bc+', so it prints '+pred+'.';
      say(msg + ' Try moving the brightness cutoff above 35 or below 20 and see what changes.');
    }
  }
  document.querySelectorAll('.pick').forEach(function(b){ b.addEventListener('click', function(){ state.note = b.dataset.note; render(); }); });
  document.querySelectorAll('.tab').forEach(function(t){ t.addEventListener('click', function(){ state.step = +t.dataset.step; render(); }); });
  document.querySelectorAll('.key').forEach(function(k){ k.addEventListener('click', function(){ state.key = k.dataset.key; render(); }); });
  function bind(id, prop, other){
    document.getElementById(id).addEventListener('input', function(e){ state[prop] = +e.target.value; if (other) document.getElementById(other).value = state[prop]; render(); });
  }
  bind('fcut','fcut','fcut3'); bind('fcut3','fcut','fcut'); bind('bcut','bcut');
  render();
})();
</script>
</body>
</html>
