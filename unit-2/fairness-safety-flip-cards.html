<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fairness and Safety Vocabulary Flip Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    padding: 16px 8px;
  }

  .card-row {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .flip-card {
    width: 240px;
    height: 220px;
    perspective: 1000px;
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
    font-family: inherit;
    text-align: left;
  }

  .flip-card:focus-visible .flip-inner {
    outline: 3px solid #ACA8EA;
    outline-offset: 4px;
    border-radius: 16px;
  }

  .flip-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.55s cubic-bezier(0.4, 0.0, 0.2, 1);
    transform-style: preserve-3d;
  }

  .flip-card.flipped .flip-inner {
    transform: rotateY(180deg);
  }

  .flip-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .flip-front {
    background: linear-gradient(145deg, #4C42CF 0%, #1F1976 100%);
    color: #ffffff;
    align-items: center;
    text-align: center;
    gap: 12px;
  }

  .flip-front .emoji { font-size: 38px; line-height: 1; }
  .flip-front .term { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .flip-front .hint {
    position: absolute; bottom: 14px; left: 0; right: 0; text-align: center;
    font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.75);
    text-transform: uppercase; letter-spacing: 0.08em;
  }

  .flip-back {
    background: #ffffff;
    border: 2px solid #4C42CF;
    color: #1A1A1A;
    transform: rotateY(180deg);
  }

  .flip-back .back-label {
    font-size: 12px; font-weight: 700; color: #4C42CF;
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px;
  }
  .flip-back .definition { font-size: 16px; line-height: 1.5; }
  .flip-back .definition strong { color: #1F1976; }

  @media (prefers-reduced-motion: reduce) {
    .flip-inner { transition: none; }
  }
</style>
</head>
<body>

<div class="card-row">

  <button class="flip-card" aria-pressed="false" onclick="toggleCard(this)">
    <div class="flip-inner">
      <div class="flip-face flip-front">
        <div class="emoji" aria-hidden="true">&#9878;&#65039;</div>
        <div class="term">Fairness</div>
        <div class="hint">Click to flip</div>
      </div>
      <div class="flip-face flip-back">
        <div class="back-label">Fairness</div>
        <div class="definition">The principle that a model should <strong>not privilege one person or group over others</strong>.</div>
      </div>
    </div>
  </button>

  <button class="flip-card" aria-pressed="false" onclick="toggleCard(this)">
    <div class="flip-inner">
      <div class="flip-face flip-front">
        <div class="emoji" aria-hidden="true">&#128737;&#65039;</div>
        <div class="term">Safety</div>
        <div class="hint">Click to flip</div>
      </div>
      <div class="flip-face flip-back">
        <div class="back-label">Safety</div>
        <div class="definition">The principle that a model should <strong>avoid causing harm</strong>.</div>
      </div>
    </div>
  </button>

</div>

<script>
  function toggleCard(card) {
    card.classList.toggle('flipped');
    card.setAttribute('aria-pressed', card.classList.contains('flipped'));
  }
</script>

</body>
</html>
